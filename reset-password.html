<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ตั้งรหัสผ่านใหม่ | น้องหมาสอนทำคลิป</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@600;700;800&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF9F0; --cream-alt:#FFF1DA; --brown:#3D2B1F; --brown-soft:#7A6552;
    --gold:#E8A33D; --coral:#F2785C; --white:#FFFFFF; --line:#EBDFC9; --green:#5FAE72;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--cream); color:var(--brown); font-family:'Sarabun', sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  h1,.display{ font-family:'Kanit', sans-serif; }
  .box{ background:var(--white); border:1px solid var(--line); border-radius:24px; max-width:400px; width:100%; padding:34px 28px; box-shadow:0 20px 50px rgba(61,43,31,.1); text-align:center; }
  .logo-badge{ width:56px; height:56px; border-radius:50%; overflow:hidden; margin:0 auto 14px; box-shadow:0 3px 0 var(--gold); }
  .logo-badge img{ width:100%; height:100%; object-fit:cover; }
  h1{ font-size:1.25rem; font-weight:700; margin-bottom:6px; }
  .sub{ font-size:.86rem; color:var(--brown-soft); margin-bottom:22px; }
  form{ display:flex; flex-direction:column; gap:12px; text-align:left; }
  input{ font-family:'Sarabun'; font-size:.94rem; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--cream); color:var(--brown); }
  input:focus{ outline:2px solid var(--gold); }
  .btn{ font-family:'Kanit'; font-weight:600; padding:13px; border-radius:999px; font-size:.96rem; border:none; cursor:pointer; background:var(--coral); color:var(--white); margin-top:4px; }
  .btn:disabled{ opacity:.6; cursor:not-allowed; }
  .msg{ font-size:.84rem; padding:10px 12px; border-radius:10px; margin-bottom:14px; display:none; }
  .msg.show-ok{ display:block; background:#E7F5EA; color:var(--green); }
  .msg.show-err{ display:block; background:#FDECEA; color:#B4443A; }
  .back-link{ display:inline-block; margin-top:18px; font-size:.84rem; color:var(--brown-soft); text-decoration:none; }
</style>
</head>
<body>
<div class="box">
  <span class="logo-badge"><img src="nongma-mascot.png" alt="น้องหมา"></span>
  <h1>ตั้งรหัสผ่านใหม่ 🐾</h1>
  <div class="sub">กรอกรหัสผ่านใหม่ที่ต้องการใช้เข้าสู่ระบบ</div>
  <div class="msg" id="msg"></div>
  <form id="resetForm">
    <input type="password" name="newPassword" placeholder="รหัสผ่านใหม่ (8 ตัวขึ้นไป)" required minlength="8">
    <input type="password" name="confirmPassword" placeholder="ยืนยันรหัสผ่านใหม่อีกครั้ง" required minlength="8">
    <button type="submit" class="btn" id="submitBtn">บันทึกรหัสผ่านใหม่</button>
  </form>
  <a class="back-link" href="index.html">← กลับหน้าเว็บหลัก</a>
</div>
<script>
const API_BASE = "https://nongma-backend.onrender.com";
const params = new URLSearchParams(window.location.search);
const token = params.get('token');
const msgEl = document.getElementById('msg');
const form = document.getElementById('resetForm');
const submitBtn = document.getElementById('submitBtn');

function showMsg(text, ok){
  msgEl.textContent = text;
  msgEl.classList.remove('show-ok', 'show-err');
  msgEl.classList.add(ok ? 'show-ok' : 'show-err');
}

if(!token){
  showMsg('ลิงก์ไม่ถูกต้อง หรือหมดอายุแล้ว กรุณาขอลิงก์รีเซ็ตใหม่จากหน้าเว็บหลัก', false);
  form.style.display = 'none';
}

form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  const fd = new FormData(form);
  const newPassword = fd.get('newPassword');
  const confirmPassword = fd.get('confirmPassword');
  if(newPassword !== confirmPassword){
    showMsg('รหัสผ่านทั้งสองช่องไม่ตรงกัน กรุณาตรวจสอบอีกครั้ง', false);
    return;
  }
  submitBtn.disabled = true;
  submitBtn.textContent = 'กำลังบันทึก...';
  try{
    const res = await fetch(API_BASE + '/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, newPassword }),
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.error || 'เกิดข้อผิดพลาด');
    showMsg(data.message + ' กำลังพาไปหน้าเข้าสู่ระบบ...', true);
    form.style.display = 'none';
    setTimeout(()=>{ window.location.href = 'index.html'; }, 2500);
  } catch(err){
    showMsg(err.message, false);
    submitBtn.disabled = false;
    submitBtn.textContent = 'บันทึกรหัสผ่านใหม่';
  }
});
</script>
</body>
</html>
